source=./launchers/binds.conf


$scripts_folder = /home/heikmike/.config/hypr/scripts

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 3200x2000@120.00, 0x0, 2

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

exec-once = $scripts_folder/weather
exec-once = /home/heikmike/.config/dunst/scripts/battery.sh
exec-once = swayidle
exec-once = wpaperd -d
exec-once = rm ~/Pictures/Screenshots/*
exec-once = redshift
exec-once = hyprctl setcursor Bibata-Modern-Ice 30
exec-once = sudo systemctl start iwd.service
exec-once = sudo systemctl start evremap.service
exec-once = sudo systemctl start bluetooth.service
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpm reload -n

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ch
    kb_variant = ,fr
    kb_model = pc105
    kb_options = caps:swapescape
    kb_rules = evdev

    follow_mouse = 2
    sensitivity = 0.2DC:2C:26:2B:56:F6 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.5
    }

}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 10
    gaps_out = 17
    border_size = 0
    resize_on_border = yes
    layout = master
}

master {
  new_status = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    
    blur {
      enabled = false
    }

    inactive_opacity = 0.6
    fullscreen_opacity = 1
    rounding = 10
    dim_around = 1
}


animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.05, 1.
    bezier = wind, 0.05, 0.9, 0.1, 1.00
    bezier = winIn, 0.1, 1.1, 0.1, 1
    bezier = winOut, 0.3, -0.3, 0, 1

    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, winOut, popin 100%
    animation = windowsIn, 1, 2, winIn, popin 30%
    animation = windowsMove, 1, 2, myBezier, slide
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, wind, slidefade 20%
}

cursor {
  min_refresh_rate = 60
  inactive_timeout = 4
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    enable_swallow = true
    new_window_takes_over_fullscreen = 2
    vfr = false
}

xwayland {
  force_zero_scaling = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device {
#     name = Epic Mouse V1
#     sensitivity = -0.5
# }

# Example windowrule v1
windowrule = float,title:rofi
windowrule = opacity 0.9,title:rofi
windowrule = move 570 170,title:rofi
windowrule = size 850 850,title:rofi
windowrule = animation popin 70%,title:rofi
# windowrule = noborder,title:rofi
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, wezterm
bind = $mainMod, Q, killactive, 
bind = $mainMod, X, exec, firefox
bind = $mainMod, A , exec, swaylock
bind = ,XF86PowerOff, exec, swaylock
# bind = $mainMod, M, exit, 

# Volume and brightness
bind = , XF86AudioRaiseVolume, exec, $scripts_folder/volume up
bind = , XF86AudioLowerVolume, exec, $scripts_folder/volume down
bind = , XF86AudioMute, exec, $scripts_folder/volume mute
bind = , XF86MonBrightnessUp, exec, $scripts_folder/brightness up
bind = , XF86MonBrightnessDown, exec, $scripts_folder/brightness down

# Screenshots
bind = , Print, exec, $scripts_folder/screenshot.sh

# Window resize
bind = $mainMod, F, fullscreen, # dwindle
bind = $mainMod, V, togglefloating,
bind = $mainMod, V, resizeactive, exact 800 500
bind = $mainMod, V, centerwindow,
bind = $mainMod, V, moveactive, 500 -300

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

$resizedelta = 150
bind = $mainMod CTRL, left, resizeactive, -$resizedelta 0
bind = $mainMod CTRL, down, resizeactive, 0 $resizedelta
bind = $mainMod CTRL, up, resizeactive, 0 -$resizedelta
bind = $mainMod CTRL, right, resizeactive, $resizedelta 0

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move windows
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, right, movewindow, r

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Switch keyboard layout
bind = $mainMod, M, exec, $scripts_folder/keyboard.sh

bind = $mainMod, B, exec, /home/heikmike/Documents/Repositories/Configurations/dunst/scripts/batteryCheck.sh
bind = $mainMod, T, exec, /home/heikmike/Documents/Repositories/Configurations/dunst/scripts/time.sh

# Settings
bind = $mainMod, period, exec, ~/.config/hypr/scripts/toggle_border.sh
bindr = $mainMod, period, exec, ~/.config/hypr/scripts/toggle_border.sh

# Toggle wallpapers
bind = $mainMod, N, exec, wpaperctl next
