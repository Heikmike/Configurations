right_format = """
  $time
"""

[battery]
disabled = true

[directory]
style = 'bold #ffffff'
format = ' [$path]($style)[$read_only]($read_only_style) '
truncation_symbol = '~/.../'

[gcloud]
disabled = true

[time]
disabled = false
format = '[$time]($style)'
style = 'bold italic'
time_format = '%R'

[os]
disabled = false
style = 'bold #1793d1'
format = ' [$symbol]($style) [󰇙](#ffffff) '
  [os.symbols]
  Arch = ""

[character]
success_symbol = "[](#8ff48a)"
vimcmd_symbol = "[](#019833)"

[cmd_duration]
min_time = 5000
format = ' - 󱎫 [$duration]($style)'

# Git
[git_branch]
symbol = " "
style = "#f1502f"

[git_status]
modified = '$count! '
deleted = '$count(red) '
untracked = '$count? '
staged = '$count+ '
style = 'bold #ffffff'
format = '([$all_status $ahead_behind]($style))'

# Programming Languages
[c]
format = "[$symbol]($style) "
symbol = ' C '
style = "#ffffff"

[python]
format = "[$symbol]($style) "
symbol = ' Python 󰌠'
style = '#ffffff'

[scala]
format = "[$symbol]($style) "
symbol = ' Scala '
style = '#ffffff'

[rust]
format = "[$symbol]($style) "
symbol = ' Rust '
style = '#ffffff'

[java]
format = "[$symbol]($style) "
symbol = ' Java '
style = '#ffffff'

[lua]
format = "[$symbol]($style) "
symbol = ' Lua '
style = '#ffffff'

[golang]
format = "[$symbol]($style) "
symbol = ' Golang '
style = '#ffffff'

[dotnet]
format = "[$symbol]($style) "
symbol = ' .NET'
style = '#ffffff'

[package]
format = '\[[$symbol $version]($style)\] '
symbol = '󰏖'
style = 'bold #eeb38c'
